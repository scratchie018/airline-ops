services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airline
      POSTGRES_PASSWORD: airline
      POSTGRES_DB: airline_ops
    ports:
      - "5432:5432"
    volumes:
      - airline_ops_pgdata:/var/lib/postgresql/data

volumes:
  airline_ops_pgdata:
